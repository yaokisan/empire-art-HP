<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | Empire Art 株式会社</title>
  <meta name="description" content="お探しのページが見つかりませんでした。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* 放送休止(NO SIGNAL)の404 */
    .p-404 {
      min-height: 100svh;
      background: var(--color-ink);
      color: rgba(245, 245, 247, 0.85);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 32px 24px;
      position: relative;
    }
    .p-404::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
      background: var(--colorbar);
    }
    .nf__label {
      font-family: var(--font-mono); font-weight: 600;
      font-size: 13px; letter-spacing: 0.4em; text-indent: 0.4em;
      color: rgba(245, 245, 247, 0.55);
      display: inline-flex; align-items: center; gap: 14px;
      margin-bottom: 24px;
    }
    .nf__label::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      background: var(--color-red);
      box-shadow: 0 0 12px rgba(210, 28, 28, 0.7);
      animation: tallyBlink 1.6s ease-in-out infinite;
    }
    .nf__code {
      font-family: var(--font-mono); font-weight: 600;
      font-size: clamp(72px, 16vw, 160px); line-height: 1;
      color: #ffffff; letter-spacing: 0.08em;
    }
    .nf__bar { display: block; width: 120px; height: 6px; background: var(--colorbar); margin: 28px auto; }
    .nf__text { color: rgba(245, 245, 247, 0.6); font-size: 14px; line-height: 2.2; }
    .nf__home {
      display: inline-block; margin-top: 36px;
      font-family: var(--font-mono); font-weight: 600;
      font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase;
      color: #ffffff; text-decoration: none;
      padding: 16px 44px;
      border: 1px solid rgba(245, 245, 247, 0.35);
      transition: border-color 0.35s, box-shadow 0.35s;
    }
    .nf__home:hover {
      opacity: 1;
      border-color: var(--color-red);
      box-shadow: 0 0 24px rgba(210, 28, 28, 0.45);
    }
  </style>
</head>
<body class="p-404">
  <main>
    <p class="nf__label">NO SIGNAL</p>
    <h1 class="nf__code">404</h1>
    <span class="nf__bar" aria-hidden="true"></span>
    <p class="nf__text">お探しのページが見つかりませんでした。<br>URLが変更されたか、削除された可能性があります。</p>
    <a class="nf__home" href="/">Back to Top</a>
  </main>
</body>
</html>
